name: pytest

on: [push, pull_request]

jobs:
  test-python-39:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6

    - name: Set CI environment variable
      run: echo "CI=true" >> $GITHUB_ENV

    - name: Configure git
      run: |
        git config --global user.email "christina.l.hedges@nasa.gov"
        git config --global user.name "Christina Hedges"
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: "3.9"

    - name: Cache Poetry dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry install --with dev

    - name: Verify installation
      run: |
        poetry show  # List installed packages
        poetry run python -c "import lkprf"  # Try to import your package to verify it's installed

    - name: Test with pytest
      run: |
        poetry run pytest --log-cli-level=INFO

  test-python-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
      fail-fast: true

    steps:
    - uses: actions/checkout@v6

    - name: Set CI environment variable
      run: echo "CI=true" >> $GITHUB_ENV

    - name: Configure git
      run: |
        git config --global user.email "christina.l.hedges@nasa.gov"
        git config --global user.name "Christina Hedges"
        
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Poetry dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pypoetry
        key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-poetry-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry install --with dev

    - name: Verify installation
      run: |
        poetry show  # List installed packages
        poetry run python -c "import lkprf"  # Try to import your package to verify it's installed

    - name: Test with pytest
      run: |
        poetry run pytest --log-cli-level=INFO